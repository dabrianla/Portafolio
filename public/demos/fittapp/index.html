<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: así Safari informa los márgenes seguros (notch y barra de inicio). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>App Fitness</title>
    <meta name="theme-color" content="#000000" />
    <!-- Instalable con "Agregar a pantalla de inicio" en iPhone y Android. -->
    <link rel="manifest" href="/demos/fittapp/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="App Fitness" />
    <link rel="apple-touch-icon" href="/demos/fittapp/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #000000;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Sello flotante de reCAPTCHA (App Check): tapaba la barra inferior. El aviso de Google va en el login. */
      .grecaptcha-badge {
        visibility: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <link rel="icon" href="/demos/fittapp/favicon.ico"/></head>

  <body>
    <noscript>
      Necesitas activar JavaScript para usar la app.
    </noscript>
    <div id="root"></div>
  <script src="/demos/fittapp/_expo/static/js/web/entry-4dda8d278ecc1b5c329dd1a7084aabed.js" defer></script>
</body>
</html>
